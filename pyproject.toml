[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egypt-job-sources"
version = "0.1.0"
description = "Read-only public Egypt job-board and freelance-project adapters with explicit source limits"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "ACKNOWLEDGMENTS.md"]
authors = [{name = "Ahmed Elkashef"}]
dependencies = ["lxml>=6,<7"]
keywords = ["egypt", "jobs", "wuzzuf", "forasna", "mostaql", "public-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.12,<1"]

[project.scripts]
egypt-job-sources = "egypt_job_sources.sources:main"
egypt-job-capture = "egypt_job_sources.capture:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
